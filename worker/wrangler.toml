name = "industrial-demo-api"
main = "src/index.ts"
compatibility_date = "2026-05-25"

[vars]
APP_ENV = "production"
AGENT_MODE = "proxy"
AGENT_API_BASE_URL = "https://api.siliconflow.cn/v1"
AGENT_MODEL = "Qwen/Qwen3-VL-32B-Instruct"
AGENT_TEXT_MODEL = "Qwen/Qwen3-30B-A3B-Instruct-2507"
AGENT_VISION_MODEL = "Qwen/Qwen3-VL-32B-Instruct"
AGENT_TIMEOUT_SECONDS = "60"
AGENT_ENABLE_THINKING = "false"
AGENT_MAX_TOKENS = "800"
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://industrial-demo-frontend.pages.dev"
CORS_ORIGIN_SUFFIXES = ".industrial-demo-frontend.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "industrial-demo-db"
database_id = "44d7d95e-a911-4de9-bbc9-6dc718966f67"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOAD_BUCKET"
bucket_name = "industrial-demo-uploads"
